<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0d47a1"><title>Automatización | Ian Martin Aguilar Alejo</title>
<style>
/* Diseño escolar: Hero azul, cards educativas y páginas de detalle sencillas. */
:root{--azul-oscuro:#082b5c;--azul:#0d47a1;--azul-medio:#1976d2;--azul-claro:#eaf3ff;--texto:#203047;--gris:#64748b;--linea:#d7e3f0;--blanco:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f8fbff;color:var(--texto);font-family:Arial,Helvetica,sans-serif;line-height:1.6}a{text-decoration:none;color:inherit}.contenedor{width:min(1100px,90%);margin:auto}.encabezado{height:68px;background:var(--blanco);border-bottom:1px solid var(--linea);display:flex;align-items:center}.barra{display:flex;align-items:center;justify-content:space-between}.marca{font-weight:bold;color:var(--azul-oscuro);letter-spacing:.05em}.marca span{color:var(--azul-medio)}.nav{display:flex;gap:25px;font-size:14px;color:var(--gris)}.nav a:hover{color:var(--azul)}
.hero{background:linear-gradient(125deg,var(--azul-oscuro),var(--azul) 60%,#2586d9);color:#fff;padding:78px 0 86px}.hero-contenido{max-width:820px}.etiqueta{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#c8e1ff;margin:0 0 18px}.hero h1{font-size:clamp(38px,6vw,70px);line-height:1.05;margin:0;font-weight:700;letter-spacing:-.04em}.hero h1 span{color:#b9ddff}.hero p{max-width:700px;font-size:17px;color:#e4f0ff;margin:24px 0 0}.datos{display:flex;flex-wrap:wrap;gap:30px;margin-top:34px;padding-top:18px;border-top:1px solid rgba(255,255,255,.3);font-size:14px}.datos strong{display:block;font-size:10px;color:#afd3f7;text-transform:uppercase;letter-spacing:.08em;font-weight:normal}.boton{display:inline-block;margin-top:30px;background:#fff;color:var(--azul);padding:12px 18px;border-radius:4px;font-weight:bold;font-size:14px}.boton:hover{background:#dff0ff}
.introduccion{padding:68px 0 30px}.introduccion h2,.detalle h1{color:var(--azul-oscuro);font-size:32px;margin:0 0 10px}.introduccion p{max-width:700px;color:var(--gris);margin:0}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;padding:32px 0 76px}.card{display:block;background:var(--blanco);border:1px solid var(--linea);border-top:4px solid var(--azul-medio);padding:26px;min-height:255px;box-shadow:0 3px 10px rgba(13,71,161,.05);transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 9px 20px rgba(13,71,161,.12)}.card-num{color:var(--azul-medio);font-size:12px;font-weight:bold}.card h3{color:var(--azul-oscuro);font-size:23px;margin:12px 0 8px}.card p{color:var(--gris);font-size:14px;margin:0}.card ul{color:var(--gris);font-size:14px;margin:14px 0 0;padding-left:20px}.card li{margin:4px 0}.ver-mas{display:inline-block;color:var(--azul-medio);font-size:13px;font-weight:bold;margin-top:17px}.seccion{padding:65px 0;border-top:1px solid var(--linea);background:#fff}.seccion h2{color:var(--azul-oscuro);font-size:30px;margin:0 0 12px}.seccion p{max-width:760px;color:var(--gris)}.codigo{max-width:700px;margin-top:25px;border:1px solid var(--linea);border-radius:5px;overflow:auto;background:#f4f8fc}.codigo-titulo{padding:9px 15px;border-bottom:1px solid var(--linea);color:var(--gris);font-size:12px}.codigo pre{padding:18px;margin:0;font:13px/1.7 Consolas,monospace;color:var(--texto)}
.detalle{padding:65px 0 85px}.volver{display:inline-block;color:var(--azul-medio);font-size:14px;margin-bottom:35px}.detalle h1{font-size:clamp(36px,5vw,58px);line-height:1.1}.detalle-intro{max-width:760px;font-size:17px;color:var(--gris)}.detalle-grid{display:grid;grid-template-columns:1.5fr .8fr;gap:55px;margin-top:42px}.detalle h2{color:var(--azul);font-size:22px;margin:0 0 12px}.detalle p,.detalle li{color:var(--gris);font-size:15px}.detalle ul{padding-left:20px}.dato-lateral{border-left:3px solid var(--azul-medio);padding:5px 0 5px 20px;margin-bottom:22px}.dato-lateral strong{display:block;color:var(--azul-oscuro);font-size:14px}.dato-lateral span{color:var(--gris);font-size:14px}.pie{padding:28px 0;color:var(--gris);font-size:13px;background:#f8fbff}.pie strong{color:var(--azul)}
@media(max-width:700px){.encabezado{height:auto;padding:17px 0}.barra{align-items:flex-start;gap:15px}.nav{gap:12px;font-size:12px}.hero{padding:55px 0 62px}.hero h1{font-size:40px}.hero p{font-size:15px}.datos{display:grid;grid-template-columns:1fr 1fr;gap:14px}.introduccion{padding-top:52px}.cards{grid-template-columns:1fr;padding-top:24px}.card{min-height:auto;padding:22px}.seccion,.detalle{padding:50px 0}.detalle-grid{grid-template-columns:1fr;gap:25px}}
</style></head>
<body><div id="app"></div>
<script>
const temas={
 fundamentos:{numero:'01',titulo:'Fundamentos de automatización',intro:'La automatización consiste en utilizar sistemas de control para realizar una tarea con poca o ninguna intervención humana. Puede aplicarse en fábricas, oficinas, comercios, hogares y servicios.',desarrollo:'Un proceso automatizado comienza con una entrada, como la información de un sensor o la acción de un usuario. Después, un controlador analiza esa información de acuerdo con un programa y finalmente genera una salida. Esta salida puede ser el movimiento de un motor, el encendido de una lámpara o el envío de una alerta.',lista:['Entrada: sensor, botón, cámara o dato.','Controlador: Arduino, computadora o PLC.','Proceso: reglas, cálculos y decisiones.','Salida: motor, luz, alarma o movimiento.']},
 conceptos:{numero:'02',titulo:'Conceptos clave',intro:'Los sistemas de automatización están formados por elementos que trabajan de manera coordinada para cumplir un objetivo.',desarrollo:'Los sensores observan el entorno y los actuadores realizan acciones. El controlador conecta ambas partes mediante un programa. También es importante la retroalimentación, que compara el resultado obtenido con el resultado esperado y permite hacer correcciones para que el sistema funcione mejor.',lista:['Sensor: detecta temperatura, luz, distancia o movimiento.','Actuador: ejecuta una acción con un motor, relé o válvula.','Controlador: procesa la información y toma decisiones.','Retroalimentación: ayuda a corregir el proceso.']},
 arduino:{numero:'03',titulo:'Arduino',intro:'Arduino es una plataforma electrónica de código abierto que permite programar placas y construir prototipos de automatización.',desarrollo:'Una placa Arduino puede leer datos de sensores conectados a sus entradas y controlar dispositivos mediante sus salidas. Su lenguaje se basa en C y utiliza dos funciones principales: setup(), que se ejecuta una vez al iniciar, y loop(), que se repite continuamente. Por su bajo costo y facilidad de uso, es una herramienta muy utilizada para aprender electrónica y programación.',lista:['Placas comunes: Arduino Uno, Nano y Mega.','Entradas digitales y analógicas para conectar sensores.','Salidas para controlar luces, motores y relés.','Programación mediante cable USB y Arduino IDE.'],codigo:'int led = 13;\n\nvoid setup() {\n  pinMode(led, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(led, HIGH);\n  delay(1000);\n  digitalWrite(led, LOW);\n  delay(1000);\n}'},
 iot:{numero:'04',titulo:'Internet de las Cosas (IoT)',intro:'El Internet de las Cosas conecta objetos físicos a una red para recopilar, enviar y consultar información.',desarrollo:'En un proyecto IoT, un sensor puede medir una variable como temperatura o humedad. Arduino procesa esa lectura y un módulo de comunicación la envía a una plataforma. El usuario puede consultar los datos desde una computadora o teléfono y recibir una alerta cuando ocurre una condición determinada.',lista:['Medición de datos mediante sensores.','Conexión por Wi-Fi, Bluetooth o red móvil.','Almacenamiento de información en una plataforma.','Monitoreo remoto y generación de alertas.']}
};
function header(){return '<header class="encabezado"><div class="contenedor barra"><a class="marca" href="#inicio">IA <span>/</span> AUTOMATIZACIÓN</a><nav class="nav"><a href="#temas">Temas</a><a href="#arduino">Arduino</a><a href="#iot">IoT</a></nav></div></header>'}
function footer(){return '<footer class="pie"><div class="contenedor"><strong>Ian Martin Aguilar Alejo</strong> · 5.- “A” Inteligencia Artificial</div></footer>'}
function card(key,t){return `<a class="card" href="#tema/${key}"><span class="card-num">${t.numero}</span><h3>${t.titulo}</h3><p>${t.intro}</p><ul>${t.lista.slice(0,2).map(x=>`<li>${x}</li>`).join('')}</ul><span class="ver-mas">Leer información completa →</span></a>`}
function home(){return `${header()}<main id="inicio"><section class="hero"><div class="contenedor hero-contenido"><p class="etiqueta">Trabajo escolar · 5.- “A” Inteligencia Artificial</p><h1>Fundamentos de automatización de procesos <span>industriales y de servicios</span></h1><p>Introducción a los conceptos principales de la automatización y al uso de Arduino e Internet de las Cosas para crear soluciones inteligentes.</p><div class="datos"><div><strong>Alumno</strong>Ian Martin Aguilar Alejo</div><div><strong>Grupo</strong>5.- “A” Inteligencia Artificial</div><div><strong>Tema</strong>Automatización, Arduino e IoT</div></div><a class="boton" href="#temas">Ver temas principales ↓</a></div></section><section class="contenedor introduccion" id="temas"><h2>Temas principales</h2><p>Selecciona una card para consultar una explicación más desarrollada sobre cada tema.</p></section><section class="contenedor cards">${card('fundamentos',temas.fundamentos)}${card('conceptos',temas.conceptos)}${card('arduino',temas.arduino)}${card('iot',temas.iot)}</section><section class="seccion"><div class="contenedor"><h2>Conclusión</h2><p>La automatización mejora la rapidez, precisión y seguridad de los procesos. Arduino ayuda a crear prototipos y IoT permite conectar esos dispositivos para consultar información a distancia.</p></div></section></main>${footer()}`}
function detalle(key){const t=temas[key]||temas.fundamentos;return `${header()}<main><section class="detalle"><div class="contenedor"><a class="volver" href="#temas">← Volver a los temas</a><p class="etiqueta">Tema ${t.numero} · Automatización</p><h1>${t.titulo}</h1><p class="detalle-intro">${t.intro}</p><div class="detalle-grid"><div><h2>Desarrollo del tema</h2><p>${t.desarrollo}</p><h2>Elementos importantes</h2><ul>${t.lista.map(x=>`<li>${x}</li>`).join('')}</ul>${t.codigo?`<div class="codigo"><div class="codigo-titulo">Ejemplo básico con Arduino</div><pre>${t.codigo}</pre></div>`:''}</div><aside><div class="dato-lateral"><strong>Alumno</strong><span>Ian Martin Aguilar Alejo</span></div><div class="dato-lateral"><strong>Grupo</strong><span>5.- “A” Inteligencia Artificial</span></div><div class="dato-lateral"><strong>Área</strong><span>Automatización e IoT</span></div></aside></div></div></section></main>${footer()}`}
function render(){const key=location.hash.startsWith('#tema/')?location.hash.slice(6):null;document.getElementById('app').innerHTML=key?detalle(key):home();window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();
</script></body></html>
