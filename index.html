<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0d47a1"><title>Portafolio de Automatización | Ian Martin Aguilar Alejo</title>
<style>
/* Portafolio escolar: Hero azul, cards educativas, diagramas internos y lectura responsive. */
:root{--azul-oscuro:#082b5c;--azul:#0d47a1;--azul-medio:#1976d2;--azul-claro:#eaf3ff;--texto:#203047;--gris:#64748b;--linea:#d7e3f0;--blanco:#fff;--verde:#287a62;--rojo:#a64949}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f8fbff;color:var(--texto);font-family:Arial,Helvetica,sans-serif;line-height:1.6}a{text-decoration:none;color:inherit}.contenedor{width:min(1100px,90%);margin:auto}.encabezado{height:68px;background:var(--blanco);border-bottom:1px solid var(--linea);display:flex;align-items:center}.barra{display:flex;align-items:center;justify-content:space-between}.marca{font-weight:bold;color:var(--azul-oscuro);letter-spacing:.05em}.marca span{color:var(--azul-medio)}.nav{display:flex;gap:25px;font-size:14px;color:var(--gris)}.nav a:hover{color:var(--azul)}.hero{background:linear-gradient(125deg,var(--azul-oscuro),var(--azul) 60%,#2586d9);color:#fff;padding:72px 0 78px}.hero-contenido{max-width:860px}.etiqueta{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#c8e1ff;margin:0 0 18px}.hero h1{font-size:clamp(36px,6vw,68px);line-height:1.05;margin:0;font-weight:700;letter-spacing:-.04em}.hero h1 span{color:#b9ddff}.hero p{max-width:740px;font-size:17px;color:#e4f0ff;margin:24px 0 0}.datos{display:flex;flex-wrap:wrap;gap:26px;margin-top:30px;padding-top:18px;border-top:1px solid rgba(255,255,255,.3);font-size:14px}.datos strong{display:block;font-size:10px;color:#afd3f7;text-transform:uppercase;letter-spacing:.08em;font-weight:normal}.boton{display:inline-block;margin-top:28px;background:#fff;color:var(--azul);padding:12px 18px;border-radius:4px;font-weight:bold;font-size:14px}.boton:hover{background:#dff0ff}.introduccion{padding:64px 0 25px}.introduccion h2,.detalle h1{color:var(--azul-oscuro);font-size:32px;margin:0 0 10px}.introduccion p{max-width:750px;color:var(--gris);margin:0}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;padding:30px 0 70px}.card{display:block;background:var(--blanco);border:1px solid var(--linea);border-top:4px solid var(--azul-medio);padding:25px;min-height:255px;box-shadow:0 3px 10px rgba(13,71,161,.05);transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 9px 20px rgba(13,71,161,.12)}.card-num{color:var(--azul-medio);font-size:12px;font-weight:bold}.card h3{color:var(--azul-oscuro);font-size:22px;margin:11px 0 8px}.card p{color:var(--gris);font-size:14px;margin:0}.card ul{color:var(--gris);font-size:14px;margin:13px 0 0;padding-left:20px}.card li{margin:4px 0}.ver-mas{display:inline-block;color:var(--azul-medio);font-size:13px;font-weight:bold;margin-top:16px}.seccion{padding:62px 0;border-top:1px solid var(--linea);background:#fff}.seccion h2{color:var(--azul-oscuro);font-size:30px;margin:0 0 12px}.seccion p{max-width:780px;color:var(--gris)}.detalle{padding:64px 0 85px}.volver{display:inline-block;color:var(--azul-medio);font-size:14px;margin-bottom:34px}.detalle h1{font-size:clamp(36px,5vw,60px);line-height:1.08}.detalle-intro{max-width:800px;font-size:17px;color:var(--gris)}.detalle-grid{display:grid;grid-template-columns:1.5fr .75fr;gap:55px;margin-top:40px}.detalle h2{color:var(--azul);font-size:23px;margin:34px 0 10px}.detalle-grid>div>h2:first-child{margin-top:0}.detalle p,.detalle li{color:var(--gris);font-size:15px}.detalle ul{padding-left:20px}.dato-lateral{border-left:3px solid var(--azul-medio);padding:5px 0 5px 20px;margin-bottom:22px}.dato-lateral strong{display:block;color:var(--azul-oscuro);font-size:14px}.dato-lateral span{color:var(--gris);font-size:14px}.codigo{margin-top:22px;border:1px solid var(--linea);border-radius:5px;overflow:auto;background:#f4f8fc}.codigo-titulo{padding:9px 15px;border-bottom:1px solid var(--linea);color:var(--gris);font-size:12px}.codigo pre{padding:18px;margin:0;font:13px/1.7 Consolas,monospace;color:var(--texto)}
/* Recursos gráficos sin imágenes: diagrama del ciclo, flujo de control y comparativa. */
.diagrama{margin:28px 0;padding:22px;background:var(--azul-claro);border:1px solid var(--linea);border-radius:6px}.diagrama-titulo{font-size:12px;color:var(--azul);font-weight:bold;text-transform:uppercase;letter-spacing:.08em;margin-bottom:20px}.ciclo{display:flex;align-items:center;justify-content:space-between;gap:8px}.paso{width:21%;text-align:center}.paso-circulo{width:50px;height:50px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--azul-medio);color:var(--azul);font-weight:bold}.paso b{display:block;color:var(--azul-oscuro);font-size:13px;margin-top:8px}.paso small{display:block;color:var(--gris);font-size:11px;line-height:1.3}.flecha{color:var(--azul-medio);font-size:22px}.flujo{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:10px}.flujo-item{padding:15px 8px;text-align:center;background:#fff;border:1px solid #bcd2e4;border-radius:4px}.flujo-item strong{display:block;color:var(--azul);font-size:14px}.flujo-item span{color:var(--gris);font-size:11px}.flujo-flecha{font-size:22px;color:var(--azul-medio)}.comparativa{width:100%;border-collapse:collapse;margin-top:22px;font-size:13px}.comparativa th{text-align:left;color:#fff;background:var(--azul);padding:12px}.comparativa td{vertical-align:top;border:1px solid var(--linea);padding:12px;color:var(--gris)}.comparativa td:first-child{font-weight:bold;color:var(--azul-oscuro);width:26%;background:var(--azul-claro)}.ventajas{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.ventajas div{padding:17px;border-radius:5px;background:#f5faf8;border:1px solid #d3e7df}.ventajas div:last-child{background:#fff8f8;border-color:#ecd7d7}.ventajas h3{margin:0 0 5px;font-size:16px;color:var(--verde)}.ventajas div:last-child h3{color:var(--rojo)}.ventajas p{margin:0;font-size:13px!important}.nota{margin-top:22px;padding:15px;background:var(--azul-claro);border-left:3px solid var(--azul-medio);color:var(--gris);font-size:14px}.pie{padding:28px 0;color:var(--gris);font-size:13px;background:#f8fbff}.pie strong{color:var(--azul)}
@media(max-width:700px){.encabezado{height:auto;padding:17px 0}.barra{align-items:flex-start;gap:15px}.nav{gap:12px;font-size:12px}.hero{padding:52px 0 60px}.hero h1{font-size:38px}.hero p{font-size:15px}.datos{display:grid;grid-template-columns:1fr 1fr;gap:14px}.introduccion{padding-top:50px}.cards{grid-template-columns:1fr;padding-top:22px}.card{min-height:auto;padding:22px}.seccion,.detalle{padding:50px 0}.detalle-grid{grid-template-columns:1fr;gap:20px}.ciclo{display:grid;grid-template-columns:1fr 1fr;gap:18px}.paso{width:auto}.flecha{display:none}.flujo{grid-template-columns:1fr;gap:7px}.flujo-flecha{text-align:center;transform:rotate(90deg)}.comparativa{font-size:11px}.comparativa th,.comparativa td{padding:8px}.ventajas{grid-template-columns:1fr}}
</style></head>
<body><div id="app"></div>
<script>
const temas={
 fundamentos:{numero:'01',titulo:'Portafolio: conceptos básicos de automatización',intro:'La automatización es el uso de dispositivos, programas y sistemas de control para realizar tareas con menor intervención humana y con resultados repetibles.',tipo:'fundamentos',secciones:[['Historia','La automatización tiene antecedentes en mecanismos antiguos, como relojes de agua, molinos y máquinas con movimientos repetitivos. Durante la Revolución Industrial se crearon máquinas capaces de repetir operaciones con fuerza y velocidad constantes. Más adelante aparecieron los sistemas eléctricos, los relés y los controladores lógicos programables o PLC. En la actualidad, la automatización integra robótica, software, sensores, inteligencia artificial e Internet de las Cosas.'],['Introducción','Un proceso automatizado recibe una entrada, analiza la información, toma una decisión y produce una salida. Por ejemplo, un sensor puede detectar que un tanque tiene poco líquido; el controlador activa una bomba y la apaga cuando el nivel alcanza la medida programada. La misma lógica puede utilizarse en una fábrica, un comercio, un hospital o una oficina.'],['Conceptos claves','Un sensor detecta una variable física; un controlador interpreta los datos; un programa establece las reglas y un actuador realiza la acción. Las entradas pueden ser temperatura, presión, luz, distancia o una orden del usuario. Las salidas pueden ser un motor, una alarma, una válvula, una pantalla o un mensaje. La retroalimentación compara el resultado con el objetivo y ayuda a corregir el proceso.'],['El ciclo de la automatización','El ciclo inicia con la detección de una condición. Después, el controlador procesa el dato y lo compara con una regla. Si se cumple la condición, se ejecuta una acción. Finalmente, el sistema verifica el resultado y vuelve a medir. Este ciclo se repite para mantener el proceso estable, seguro y eficiente.'],['Ventajas y desventajas','Entre las ventajas se encuentran la rapidez, precisión, repetibilidad, ahorro de tiempo, reducción de errores y mayor seguridad en tareas peligrosas. Entre las desventajas se encuentran la inversión inicial, el mantenimiento, la necesidad de capacitación, la dependencia de la energía y el riesgo de que una falla afecte varias etapas del proceso.'],['Diferencias entre automatización de procesos industriales y de servicios','En la industria, la automatización controla máquinas, líneas de producción, temperatura, presión, movimiento de materiales y calidad de productos. En los servicios, automatiza actividades como citas, atención al cliente, inventarios, reportes, pagos y notificaciones. La industria trabaja principalmente con maquinaria y objetos físicos; los servicios trabajan principalmente con información y atención a personas.']],lista:['Entrada: información de un sensor, botón o usuario.','Controlador: Arduino, PLC, computadora o sistema digital.','Proceso: programa que analiza y toma decisiones.','Salida: acción realizada por un actuador o dispositivo.'],ejemplo:'En un sistema de riego, el sensor mide la humedad del suelo. Si el valor es bajo, Arduino activa una bomba; cuando la humedad aumenta, la bomba se apaga.'},
 conceptos:{numero:'02',titulo:'Conceptos clave de automatización',intro:'Los conceptos principales permiten entender cómo se comunican las partes de un sistema automático.',tipo:'conceptos',secciones:[['Sensor','Un sensor convierte una condición del entorno en una señal que puede interpretar un controlador. Por ejemplo, un sensor de temperatura entrega un valor que puede utilizarse para encender un ventilador.'],['Actuador','Es el dispositivo que realiza una acción. Puede encender una lámpara, mover un motor, abrir una válvula o activar una alarma.'],['Controlador','Recibe información, ejecuta un programa y decide qué salida debe activarse. Arduino y los PLC son ejemplos de controladores.'],['Retroalimentación','Permite saber si la acción produjo el resultado esperado. Un termostato mide la temperatura, compara el valor con el objetivo y decide si debe encender o apagar un equipo.']],lista:['Entrada: información del entorno.','Proceso: análisis y decisión.','Salida: acción del sistema.'],ejemplo:'Un sensor de distancia detecta un objeto a menos de 10 centímetros y el controlador enciende una luz de advertencia.'},
 arduino:{numero:'03',titulo:'Arduino',intro:'Arduino es una plataforma electrónica de código abierto que facilita la creación de prototipos y proyectos de automatización.',tipo:'arduino',secciones:[['¿Cómo funciona?','La placa recibe señales de sensores por sus entradas, ejecuta un programa y controla salidas. El programa se desarrolla normalmente en Arduino IDE y se transfiere mediante USB. La función setup() se ejecuta al iniciar y loop() repite las instrucciones continuamente.'],['Aplicaciones','Arduino puede utilizarse para alarmas, robots, riego automático, control de iluminación, medición de temperatura y prototipos de IoT. Su valor educativo está en conectar la programación con componentes físicos.']],lista:['Placas Arduino Uno, Nano y Mega.','Entradas digitales y analógicas.','Salidas para LED, motores y relés.','Sensores de temperatura, luz y distancia.'],ejemplo:'Un sensor de humedad se conecta a una entrada analógica. Si la lectura es menor que un límite, Arduino activa un relé para encender una bomba.',codigo:'int led = 13;\n\nvoid setup() {\n  pinMode(led, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(led, HIGH);\n  delay(1000);\n  digitalWrite(led, LOW);\n  delay(1000);\n}'},
 iot:{numero:'04',titulo:'Internet de las Cosas (IoT)',intro:'El IoT conecta objetos físicos a una red para recopilar datos, compartirlos y tomar decisiones a distancia.',tipo:'iot',secciones:[['Funcionamiento','Un dispositivo IoT combina sensores, un controlador, una conexión y una plataforma donde se almacenan o visualizan los datos. El sistema puede enviar una alerta cuando detecta una condición importante.'],['Ejemplo práctico','Un sensor conectado a Arduino mide la temperatura de un invernadero. Un módulo Wi-Fi envía la lectura a una plataforma. Desde un teléfono, el usuario revisa el valor y recibe una notificación si la temperatura es demasiado alta.']],lista:['Sensores para recopilar información.','Wi-Fi, Bluetooth u otra conexión.','Plataforma para guardar datos.','Panel de monitoreo y alertas.'],ejemplo:'Un sistema IoT puede avisar al celular cuando una máquina supera su temperatura normal o cuando un tanque necesita ser rellenado.'}
};
function header(){return '<header class="encabezado"><div class="contenedor barra"><a class="marca" href="#inicio">IA <span>/</span> AUTOMATIZACIÓN</a><nav class="nav"><a href="#temas">Temas</a><a href="#arduino">Arduino</a><a href="#iot">IoT</a></nav></div></header>'}function footer(){return '<footer class="pie"><div class="contenedor"><strong>Ian Martin Aguilar Alejo</strong> · Docente: Jordy Chirino Balcazar · Especialidad: Inteligencia Artificial</div></footer>'}
function card(key,t){return `<a class="card" href="#tema/${key}"><span class="card-num">${t.numero}</span><h3>${t.titulo}</h3><p>${t.intro}</p><ul>${t.lista.slice(0,2).map(x=>`<li>${x}</li>`).join('')}</ul><span class="ver-mas">Abrir información completa →</span></a>`}
function grafico(tipo){if(tipo==='fundamentos')return `<div class="diagrama"><div class="diagrama-titulo">Recurso gráfico · ciclo de automatización</div><div class="ciclo"><div class="paso"><div class="paso-circulo">1</div><b>Detectar</b><small>El sensor obtiene un dato.</small></div><div class="flecha">→</div><div class="paso"><div class="paso-circulo">2</div><b>Procesar</b><small>El controlador analiza.</small></div><div class="flecha">→</div><div class="paso"><div class="paso-circulo">3</div><b>Actuar</b><small>El actuador responde.</small></div><div class="flecha">→</div><div class="paso"><div class="paso-circulo">4</div><b>Verificar</b><small>Se revisa el resultado.</small></div></div></div><div class="diagrama"><div class="diagrama-titulo">Ejemplo visual · sistema de riego</div><div class="flujo"><div class="flujo-item"><strong>Sensor</strong><span>Humedad baja</span></div><div class="flujo-flecha">→</div><div class="flujo-item"><strong>Arduino</strong><span>Compara el valor</span></div><div class="flujo-flecha">→</div><div class="flujo-item"><strong>Bomba</strong><span>Riega el suelo</span></div></div></div>`;if(tipo==='conceptos')return `<div class="diagrama"><div class="diagrama-titulo">Recurso gráfico · partes de un sistema</div><div class="flujo"><div class="flujo-item"><strong>Entrada</strong><span>Sensor o botón</span></div><div class="flujo-flecha">→</div><div class="flujo-item"><strong>Control</strong><span>Programa y decisión</span></div><div class="flujo-flecha">→</div><div class="flujo-item"><strong>Salida</strong><span>Motor o alarma</span></div></div></div>`;if(tipo==='arduino')return `<div class="diagrama"><div class="diagrama-titulo">Recurso gráfico · Arduino como controlador</div><div class="flujo"><div class="flujo-item"><strong>Sensores</strong><span>Temperatura / luz</span></div><div class="flujo-flecha">→</div><div class="flujo-item"><strong>Arduino</strong><span>Programa</span></div><div class="flujo-flecha">→</div><div class="flujo-item"><strong>Actuadores</strong><span>LED / motor</span></div></div></div>`;return `<div class="diagrama"><div class="diagrama-titulo">Recurso gráfico · arquitectura IoT</div><div class="flujo"><div class="flujo-item"><strong>Objeto</strong><span>Sensor conectado</span></div><div class="flujo-flecha">→</div><div class="flujo-item"><strong>Red</strong><span>Wi-Fi / Bluetooth</span></div><div class="flujo-flecha">→</div><div class="flujo-item"><strong>Usuario</strong><span>App y alertas</span></div></div></div>`}
function comparativa(){return `<table class="comparativa"><thead><tr><th>Aspecto</th><th>Procesos industriales</th><th>Procesos de servicios</th></tr></thead><tbody><tr><td>Objetivo</td><td>Fabricar, transformar o revisar productos.</td><td>Atender personas o gestionar información.</td></tr><tr><td>Elementos comunes</td><td>Máquinas, motores, sensores, PLC y robots.</td><td>Computadoras, aplicaciones, bases de datos y notificaciones.</td></tr><tr><td>Ejemplo</td><td>Una banda transportadora separa piezas por tamaño.</td><td>Un sistema asigna citas y envía recordatorios.</td></tr><tr><td>Resultado</td><td>Producto terminado, medición o control físico.</td><td>Respuesta, registro, trámite o atención realizada.</td></tr></tbody></table>`}
function detalle(key){const t=temas[key]||temas.fundamentos;return `${header()}<main><section class="detalle"><div class="contenedor"><a class="volver" href="#temas">← Volver al portafolio</a><p class="etiqueta">Tema ${t.numero} · Desarrollo ampliado</p><h1>${t.titulo}</h1><p class="detalle-intro">${t.intro}</p>${grafico(t.tipo)}<div class="detalle-grid"><div>${t.secciones.map(s=>`<section><h2>${s[0]}</h2><p>${s[1]}</p>${s[0]==='Ventajas y desventajas'?'<div class="ventajas"><div><h3>Ventajas</h3><p>Más rapidez, precisión, seguridad y repetibilidad en las tareas.</p></div><div><h3>Desventajas</h3><p>Inversión, mantenimiento, capacitación y dependencia tecnológica.</p></div></div>':''}${s[0].startsWith('Diferencias')?comparativa():''}</section>`).join('')}<h2>Elementos y ejemplo práctico</h2><ul>${t.lista.map(x=>`<li>${x}</li>`).join('')}</ul><div class="nota"><strong>Ejemplo:</strong> ${t.ejemplo}</div>${t.codigo?`<div class="codigo"><div class="codigo-titulo">Arduino · ejemplo de código</div><pre>${t.codigo}</pre></div>`:''}</div><aside><div class="dato-lateral"><strong>Alumno</strong><span>Ian Martin Aguilar Alejo</span></div><div class="dato-lateral"><strong>Docente</strong><span>Jordy Chirino Balcazar</span></div><div class="dato-lateral"><strong>Especialidad</strong><span>Inteligencia Artificial</span></div><div class="dato-lateral"><strong>Portafolio</strong><span>Automatización de procesos industriales y de servicios</span></div></aside></div></div></section></main>${footer()}`}
function home(){return `${header()}<main id="inicio"><section class="hero"><div class="contenedor hero-contenido"><p class="etiqueta">Portafolio escolar · 5.- “A” Inteligencia Artificial</p><h1>Automatización de procesos <span>industriales y de servicios</span></h1><p>Trabajo de investigación sobre fundamentos de automatización, Arduino e Internet de las Cosas, con conceptos, diagramas y ejemplos prácticos.</p><div class="datos"><div><strong>Alumno</strong>Ian Martin Aguilar Alejo</div><div><strong>Docente</strong>Jordy Chirino Balcazar</div><div><strong>Especialidad</strong>Inteligencia Artificial</div></div><a class="boton" href="#temas">Explorar portafolio ↓</a></div></section><section class="contenedor introduccion" id="temas"><h2>Contenido del portafolio</h2><p>Selecciona una card para abrir una página con información ampliada, recursos gráficos y ejemplos relacionados.</p></section><section class="contenedor cards">${card('fundamentos',temas.fundamentos)}${card('conceptos',temas.conceptos)}${card('arduino',temas.arduino)}${card('iot',temas.iot)}</section><section class="seccion"><div class="contenedor"><h2>Conclusión general</h2><p>La automatización une sensores, controladores, programas y actuadores para resolver tareas de forma ordenada. Arduino permite experimentar con estos elementos e IoT amplía sus posibilidades al conectar los datos con una red.</p></div></section></main>${footer()}`}
function render(){const key=location.hash.startsWith('#tema/')?location.hash.slice(6):null;document.getElementById('app').innerHTML=key?detalle(key):home();window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();
</script></body></html>
